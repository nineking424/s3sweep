apiVersion: v1
kind: Secret
metadata:
  name: rclone-secret
  labels:
    app: rclone-worker
    component: config
  annotations:
    description: "Sensitive rclone credentials - merged with ConfigMap via projected volume"
type: Opaque
stringData:
  rclone.conf: |
    # IMPORTANT: Replace all credentials below with actual values
    # This Secret is merged with the ConfigMap to produce /etc/rclone/rclone.conf
    #
    # Each [remote_name] section here adds credentials to the corresponding
    # remote defined in configmap.yaml. The remote names MUST match.

    [s3_a]
    access_key_id = REPLACE_WITH_ACTUAL_ACCESS_KEY_A
    secret_access_key = REPLACE_WITH_ACTUAL_SECRET_KEY_A

    [s3_b]
    access_key_id = REPLACE_WITH_ACTUAL_ACCESS_KEY_B
    secret_access_key = REPLACE_WITH_ACTUAL_SECRET_KEY_B

    # Add credentials for additional remotes:
    # [s3_prod]
    # access_key_id = AKIAIOSFODNN7EXAMPLE
    # secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

---
# ALTERNATIVE: Use existing secrets from your secret management system
# Uncomment and modify this example to reference external secrets:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: rclone-secret
#   labels:
#     app: rclone-worker
#     component: config
# type: Opaque
# data:
#   rclone.conf: |  # Base64-encoded rclone.conf with credentials
#     # Use: kubectl create secret generic rclone-secret --from-file=rclone.conf=<path>
