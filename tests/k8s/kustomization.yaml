# Kustomization overlay for s3sweep testing
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference base manifests
resources:
  - ../../configmap-example.yaml
  - ../../secret-example.yaml
  - ../../statefulset-example.yaml

# Namespace for test deployment
namespace: s3sweep-test

# Test-specific patches
patches:
  # Use test image
  - target:
      kind: StatefulSet
      name: rclone-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: s3sweep:test

  # Lower resource requests for testing
  - target:
      kind: StatefulSet
      name: rclone-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m

  # Add test environment variables
  - target:
      kind: StatefulSet
      name: rclone-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TEST_MODE
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: "debug"

  # Update rclone config to use MinIO
  - target:
      kind: ConfigMap
      name: rclone-config
    patch: |-
      - op: replace
        path: /data/rclone.conf
        value: |
          [s3_a]
          type = s3
          provider = Minio
          endpoint = http://minio.minio.svc.cluster.local:9000
          access_key_id = minioadmin
          secret_access_key = minioadmin

          [s3_b]
          type = s3
          provider = Minio
          endpoint = http://minio.minio.svc.cluster.local:9000
          access_key_id = minioadmin
          secret_access_key = minioadmin

          [s3_c]
          type = s3
          provider = Minio
          endpoint = http://minio.minio.svc.cluster.local:9000
          access_key_id = minioadmin
          secret_access_key = minioadmin

  # Use emptyDir for testing (no NFS)
  - target:
      kind: StatefulSet
      name: rclone-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          emptyDir: {}

# Set initial replica count to 1
replicas:
  - name: rclone-worker
    count: 1

# Add test labels
commonLabels:
  test-suite: s3sweep-k8s
  environment: test
