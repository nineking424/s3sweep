name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core && sudo ./install.sh /usr/local

      - name: Run unit tests
        run: |
          if [ -d tests/unit ]; then
            bats tests/unit/
          else
            echo "No unit tests found - skipping"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: tests/unit/*.tap
          if-no-files-found: ignore

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # MinIO server command
        cmd: server /data --console-address ":9001"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup MinIO client
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc && sudo mv mc /usr/local/bin/
          mc alias set test http://localhost:9000 minioadmin minioadmin
          mc mb test/testbucket || true
          mc mb test/s3-a || true
          mc mb test/s3-b || true

      - name: Upload test data to MinIO
        run: |
          # Create test files
          mkdir -p /tmp/testdata
          echo "test content 1" > /tmp/testdata/file1.txt
          echo "test content 2" > /tmp/testdata/file2.txt
          echo "test content 3" > /tmp/testdata/file3.txt

          # Upload to MinIO
          mc cp /tmp/testdata/file1.txt test/testbucket/path/to/file1.txt
          mc cp /tmp/testdata/file2.txt test/testbucket/path/to/file2.txt
          mc cp /tmp/testdata/file3.txt test/s3-a/another/file3.txt

      - name: Build worker image
        run: |
          docker build -t s3sweep:test .

      - name: Run integration tests
        run: |
          if [ -f tests/integration/test_e2e.sh ]; then
            chmod +x tests/integration/test_e2e.sh
            ./tests/integration/test_e2e.sh
          else
            echo "Integration test script not found - skipping"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/integration/*.log
            tests/integration/*.tap
          if-no-files-found: ignore

  kubernetes:
    name: Kubernetes Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: s3sweep-test
          wait: 120s

      - name: Build and load image
        run: |
          docker build -t s3sweep:test .
          kind load docker-image s3sweep:test --name s3sweep-test

      - name: Verify image loaded
        run: |
          docker exec s3sweep-test-control-plane crictl images | grep s3sweep || exit 1

      - name: Deploy MinIO to cluster
        run: |
          if [ -f tests/k8s/minio.yaml ]; then
            kubectl apply -f tests/k8s/minio.yaml
            kubectl wait --for=condition=ready pod -l app=minio --timeout=120s
          else
            echo "MinIO test manifest not found - creating inline"
            kubectl create namespace minio || true
            kubectl run minio --image=minio/minio:latest --port=9000 \
              --env="MINIO_ROOT_USER=minioadmin" \
              --env="MINIO_ROOT_PASSWORD=minioadmin" \
              -- server /data
            kubectl wait --for=condition=ready pod/minio --timeout=120s
            kubectl expose pod minio --port=9000 --target-port=9000
          fi

      - name: Setup test environment
        run: |
          if [ -f tests/k8s/setup.sh ]; then
            chmod +x tests/k8s/setup.sh
            ./tests/k8s/setup.sh
          else
            echo "Test setup script not found - using basic setup"
            # Apply example configurations
            kubectl create configmap rclone-config --from-file=configmap-example.yaml || true
            kubectl create secret generic rclone-secret --from-file=secret-example.yaml || true
          fi

      - name: Run Kubernetes tests
        run: |
          if [ -f tests/k8s/test_scaling.sh ]; then
            chmod +x tests/k8s/test_scaling.sh
            ./tests/k8s/test_scaling.sh
          else
            echo "Scaling test script not found - running basic verification"
            # Deploy StatefulSet
            kubectl apply -f statefulset-example.yaml

            # Wait for at least one pod to be ready
            kubectl wait --for=condition=ready pod -l app=rclone-worker --timeout=120s || true

            # Check pod status
            kubectl get pods -l app=rclone-worker
            kubectl describe statefulset rclone-worker
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/k8s-logs
          kubectl get all --all-namespaces > /tmp/k8s-logs/all-resources.txt || true
          kubectl logs -l app=rclone-worker --tail=500 > /tmp/k8s-logs/worker-logs.txt || true
          kubectl logs -l app=minio --tail=500 > /tmp/k8s-logs/minio-logs.txt || true
          kubectl describe pods > /tmp/k8s-logs/pod-descriptions.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-test-results
          path: |
            /tmp/k8s-logs/
            tests/k8s/*.log
          if-no-files-found: ignore

  chaos:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Toxiproxy
        run: |
          docker run -d --name toxiproxy \
            -p 8474:8474 -p 8666:8666 \
            ghcr.io/shopify/toxiproxy:latest

          # Wait for Toxiproxy to be ready
          timeout 30 bash -c 'until curl -f http://localhost:8474/version 2>/dev/null; do sleep 1; done'

      - name: Setup MinIO behind Toxiproxy
        run: |
          # Start MinIO
          docker run -d --name minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 \
            minio/minio:latest server /data

          # Wait for MinIO
          timeout 30 bash -c 'until curl -f http://localhost:9000/minio/health/live 2>/dev/null; do sleep 1; done'

          # Get MinIO container IP
          MINIO_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' minio)

          # Create Toxiproxy proxy to MinIO
          curl -X POST http://localhost:8474/proxies \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"minio\",\"listen\":\"0.0.0.0:8666\",\"upstream\":\"${MINIO_IP}:9000\",\"enabled\":true}"

      - name: Build worker image
        run: |
          docker build -t s3sweep:test .

      - name: Run chaos tests
        run: |
          if [ -f tests/chaos/network_partition.sh ]; then
            chmod +x tests/chaos/network_partition.sh
            ./tests/chaos/network_partition.sh
          else
            echo "Chaos test script not found - running basic network fault injection"

            # Test with latency
            echo "Testing with 500ms latency..."
            curl -X POST http://localhost:8474/proxies/minio/toxics \
              -H "Content-Type: application/json" \
              -d '{"name":"latency","type":"latency","attributes":{"latency":500}}'

            # Run a basic test through the proxy
            docker run --rm --network host s3sweep:test \
              rclone version || echo "Latency test completed"

            # Remove latency toxic
            curl -X DELETE http://localhost:8474/proxies/minio/toxics/latency

            # Test with bandwidth limitation
            echo "Testing with bandwidth limit..."
            curl -X POST http://localhost:8474/proxies/minio/toxics \
              -H "Content-Type: application/json" \
              -d '{"name":"bandwidth","type":"bandwidth","attributes":{"rate":1024}}'

            sleep 2

            # Remove bandwidth toxic
            curl -X DELETE http://localhost:8474/proxies/minio/toxics/bandwidth
          fi

      - name: Collect chaos test logs
        if: always()
        run: |
          mkdir -p /tmp/chaos-logs
          docker logs toxiproxy > /tmp/chaos-logs/toxiproxy.log 2>&1 || true
          docker logs minio > /tmp/chaos-logs/minio.log 2>&1 || true
          curl http://localhost:8474/proxies > /tmp/chaos-logs/proxy-status.json 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-results
          path: |
            /tmp/chaos-logs/
            tests/chaos/*.log
          if-no-files-found: ignore

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit, integration, kubernetes, chaos]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Kubernetes Tests: ${{ needs.kubernetes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chaos Tests: ${{ needs.chaos.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any required test failed
          if [ "${{ needs.unit.result }}" = "failure" ] || \
             [ "${{ needs.integration.result }}" = "failure" ] || \
             [ "${{ needs.kubernetes.result }}" = "failure" ]; then
            echo "❌ Required tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All required tests passed" >> $GITHUB_STEP_SUMMARY
          fi
