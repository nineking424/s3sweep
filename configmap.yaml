apiVersion: v1
kind: ConfigMap
metadata:
  name: rclone-config
  labels:
    app: rclone-worker
    component: config
  annotations:
    description: "Non-sensitive rclone configuration (endpoints, providers, ACLs)"
data:
  rclone.conf: |
    # Example S3 remote configurations
    # This ConfigMap is merged with the Secret to create /etc/rclone/rclone.conf
    #
    # Add your S3 endpoints here. Credentials go in secret.yaml.
    # Remote names (e.g., s3_a, s3_b) are referenced in job definitions.

    [s3_a]
    type = s3
    provider = Other  # Use AWS, Minio, Ceph, or Other based on your S3 implementation
    endpoint = http://s3-a.example.com
    acl = private
    # Add other rclone S3 options as needed:
    # region = us-east-1
    # location_constraint = us-east-1

    [s3_b]
    type = s3
    provider = Other
    endpoint = http://s3-b.example.com
    acl = private

    # Add more remotes as needed:
    # [s3_prod]
    # type = s3
    # provider = AWS
    # endpoint = https://s3.amazonaws.com
    # region = us-west-2
